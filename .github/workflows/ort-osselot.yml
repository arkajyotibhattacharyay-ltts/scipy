name: ORT Scan with OSSelot Integration

on:
  push:
    branches:
      - feature-osselot
  pull_request:
    branches:
      - feature-osselot

jobs:
  ort-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare ORT results directory
        run: mkdir -p ort-results

      - name: Run ORT analyze with OSSelot
        run: |
          docker run --rm -v ${{ github.workspace }}:/project \
            ghcr.io/oss-review-toolkit/ort:latest \
            analyze -i /project -o /project/ort-results

      - name: Run ORT evaluate (license compliance)
        run: |
          docker run --rm -v ${{ github.workspace }}:/project \
            ghcr.io/oss-review-toolkit/ort:latest \
            evaluate -i /project/ort-results/analyzer-result.yml \
            -o /project/ort-results/evaluation-result.yml

      - name: Generate ORT HTML report
        run: |
          docker run --rm -v ${{ github.workspace }}:/project \
            ghcr.io/oss-review-toolkit/ort:latest \
            report -i /project/ort-results/analyzer-result.yml \
            -o /project/ort-results --report-formats Html

      - name: Upload ORT results
        uses: actions/upload-artifact@v4
        with:
          name: ort-results
          path: ort-results/
